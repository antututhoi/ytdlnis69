name: Build (MiXplorer fork)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Prepare signing key (same key every build, so updates install over the old app)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/my.keystore"
            printf 'signingConfig.storeFile=%s\nsigningConfig.storePassword=ytdlnis123\nsigningConfig.keyAlias=key0\nsigningConfig.keyPassword=ytdlnis123\n' "$GITHUB_WORKSPACE/my.keystore" > keystore.properties
          else
            echo "No KEYSTORE_B64 secret found, using a temporary key"
            touch keystore.properties
          fi

      - name: Build
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew assembleGithubRelease --warning-mode all

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-mixplorer-apks
          path: app/build/outputs/apk/github/release/*.apk
